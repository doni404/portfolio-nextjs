name: Prepare Journal Drafts
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-drafts
  cancel-in-progress: false
jobs:
  drafts:
    if: vars.EDITORIAL_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --include=dev
        working-directory: apps/api
      - run: node scripts/editorial-worker.mjs
        working-directory: apps/api
        env:
          EDITORIAL_API_URL: ${{ vars.EDITORIAL_API_URL }}
          AUTOMATION_WORKER_TOKEN: ${{ secrets.AUTOMATION_WORKER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
